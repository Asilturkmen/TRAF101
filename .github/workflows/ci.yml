name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content (strict)
        run: npm run validate:strict
      - name: Unit tests
        run: npm test
      - name: Build (prerender, sitemap, OG images, service worker)
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://test2drive.example' }}
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
